name: Deploy to Beget

# Replaces the GitLab FTPS job, which died with the GitLab account. Beget is
# plain file hosting — it has no idea the repo changed — so without this, an
# edit lands in git and never reaches visitors.
#
# SETUP — repo Settings > Secrets and variables > Actions > New repository secret:
#   FTP_HOST      tryphopx.beget.tech
#   FTP_USER      the FTP account login
#   FTP_PASSWORD  its password
#   REMOTE_DIR    /coffeeshtob.ru/public_html

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave over the same FTP tree. Queue instead of
# cancelling: a half-finished mirror that gets cancelled leaves the site in a
# mixed state, which is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets exist
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          missing=
          for v in FTP_HOST FTP_USER FTP_PASSWORD REMOTE_DIR; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Built from `git ls-files` rather than mirroring the checkout, so the
      # upload set is exactly what is tracked — no .git, no runner droppings,
      # and nothing that happens to be lying around.
      #
      # `grav/` is excluded because it belongs to the OTHER site. It holds the
      # Grav theme for the staging install and has no meaning on the static
      # production site. Adding it to the repo without adding it here shipped
      # the whole theme — CSS, fonts, images, templates, page content — to
      # coffeeshtob.ru, where /grav/user/themes/coffeeshtob/css/style.css was
      # publicly serving 200. Whenever a directory is added to this repo for a
      # different deploy target, it has to be excluded here in the same commit.
      - name: Assemble the upload set
        run: |
          set -euo pipefail
          rm -rf _deploy && mkdir _deploy
          git ls-files \
            | grep -vE '^(CLAUDE\.md|\.gitignore|\.github/|\.claude/|grav/)' \
            | while IFS= read -r f; do
                mkdir -p "_deploy/$(dirname "$f")"
                cp "$f" "_deploy/$f"
              done

          # Assert rather than hope. A silently empty or half-built set would
          # be mirrored with --delete and would take the live site with it.
          test -f _deploy/index.html            || { echo "no index.html"; exit 1; }
          test -f _deploy/.htaccess             || { echo "no root .htaccess"; exit 1; }
          test -f _deploy/images/uploads/.htaccess || { echo "no uploads .htaccess"; exit 1; }
          test ! -e _deploy/CLAUDE.md           || { echo "CLAUDE.md leaked"; exit 1; }
          test ! -e _deploy/.git                || { echo ".git leaked"; exit 1; }
          n=$(find _deploy -type f | wc -l)
          [ "$n" -ge 40 ] || { echo "only $n files assembled — refusing to deploy"; exit 1; }
          echo "assembled $n files"

      # nginx serves static files on Beget and ignores .htaccess, so its own
      # cache headers win (style.css comes back with a week-long max-age). No
      # filename here carries a content hash, so the URL carries the version
      # instead. Stamping it from the commit means a deploy always reaches
      # people who have already visited, without anyone remembering to bump it.
      - name: Stamp asset version from the commit
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::7}"
          # An empty V is the dangerous case, not a missing one: sed would
          # happily write "?v=" and the count check below would still see seven
          # matches and pass, shipping an unversioned site that looks fine. This
          # was caught in a local dry run where GITHUB_SHA happened to be unset.
          [ -n "$V" ] || { echo "GITHUB_SHA is empty — refusing to stamp"; exit 1; }
          for f in index.html privacy.html 404.html; do
            sed -i -E "s/\?v=[A-Za-z0-9_.-]+/?v=$V/g" "_deploy/$f"
          done
          n=$(grep -ho "?v=$V" _deploy/index.html _deploy/privacy.html _deploy/404.html | wc -l)
          [ "$n" -eq 7 ] || { echo "expected 7 versioned refs, stamped $n"; exit 1; }
          echo "stamped ?v=$V on $n references"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mirror to Beget over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          # --delete makes the server match the repo exactly, so a file deleted
          # here disappears there and stale assets cannot accumulate. That is
          # also what makes the two excludes below load-bearing:
          #
          #   cgi-bin/     Beget creates it in every docroot. It is not in the
          #                repo, so --delete would remove it.
          #   .well-known/ where Let's Encrypt writes its ACME challenge. Wiping
          #                it mid-renewal breaks certificate renewal every 90
          #                days, and the failure would look like nothing to do
          #                with deploys.
          #
          #   og-image.jpg IS A KNOWN UNSOLVED BUG, not a design decision.
          #
          #     lftp will not upload this one file to this one host. It is a
          #     valid 42 KB JPEG, it is in the upload set (verified by
          #     assembling it locally), and uploading it by hand through Beget's
          #     File Manager works first time and serves 200. But `mirror` skips
          #     it while exiting 0, AND an explicit `put` of it also fails —
          #     two different lftp code paths, same file. Every other
          #     root-level binary (favicon.ico, favicon.svg, apple-touch-icon,
          #     icon-192, icon-512) uploads fine, as does images/uploads/*.jpg,
          #     so it is not .jpg files and not root-level files as a class.
          #
          #     Three theories were tried and all were wrong: a parallel-transfer
          #     race, Beget rejecting the file, and a malformed repair command.
          #
          #     Excluding it stops --delete removing the hand-uploaded copy, so
          #     the file survives deploys. IT MUST BE UPLOADED MANUALLY once, and
          #     again if it ever changes. It is the Open Graph card, so its
          #     absence shows up as a broken Telegram or VK link preview.
          #
          #     Grav will replace this deploy layout entirely, which is the real
          #     reason this is parked rather than solved — the bug may not
          #     survive the migration. If it does, read the repair script the
          #     verify step prints rather than guessing a fourth time.
          #
          # WHEN GRAV LANDS: content will be edited on the server rather than
          # committed, at which point --delete will destroy the client's work on
          # the next push. Add --exclude user/ (or whatever holds content and
          # uploads) then, or drop --delete.
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --delete --verbose --parallel=2 \
              --exclude-glob cgi-bin/ \
              --exclude-glob .well-known/ \
              --exclude-glob og-image.jpg \
              _deploy/ '$REMOTE_DIR';
          "

      # lftp exits 0 having silently skipped files. Confirmed on this host:
      # og-image.jpg — tracked, in the upload set, 42 KB, a valid JPEG — was
      # skipped by `mirror` on two consecutive runs, while uploading the same
      # file by hand through Beget's File Manager worked first time and served
      # correctly. So the server is fine and lftp is the problem, and the cause
      # is not reproducible without this specific FTP endpoint.
      #
      # Rather than keep guessing at why, repair it: the comparison already
      # knows exactly which files are missing, so put them individually and
      # check again. A single skipped file here is invisible — og-image.jpg is
      # the social card, and its absence shows up only as a broken Telegram or
      # VK link preview weeks later.
      - name: Verify every file arrived, and repair what did not
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -uo pipefail

          remote_list() {
            lftp -c "
              set ftp:ssl-allow true; set ftp:ssl-force true;
              set ssl:verify-certificate no;
              set net:max-retries 3; set net:timeout 20;
              open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
              cd '$REMOTE_DIR';
              find;
            " 2>/dev/null | sed 's|^\./||' | sed 's|/$||' | grep -v '^$' | sort
          }

          # og-image.jpg is deliberately not expected here — see the mirror step.
          # It is excluded from the mirror so --delete stops removing it, and
          # therefore cannot be checked for or repaired by this step either.
          ( cd _deploy && find . -type f | sed 's|^\./||' ) \
            | grep -v '^og-image\.jpg$' | sort > /tmp/expected.txt
          remote_list > /tmp/remote.txt
          comm -23 /tmp/expected.txt /tmp/remote.txt > /tmp/missing.txt || true

          echo "expected $(wc -l < /tmp/expected.txt) files"
          if [ ! -s /tmp/missing.txt ]; then
            echo "all files present"
            exit 0
          fi

          echo "missing after mirror — repairing:"
          sed 's/^/  /' /tmp/missing.txt
          {
            echo "set ftp:ssl-allow true; set ftp:ssl-force true;"
            echo "set ssl:verify-certificate no;"
            echo "set net:max-retries 3; set net:timeout 20;"
            # Keep going if a command fails. mkdir on a directory that already
            # exists is an error in lftp, and by default that aborts the rest of
            # the script — taking the puts with it. The re-check below is what
            # decides success, so tolerating individual failures here is safe.
            echo "set cmd:fail-exit false;"
            echo "open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';"
            while IFS= read -r f; do
              d=$(dirname "$f")
              if [ "$d" = "." ]; then
                # A root-level file. dirname gives "." and naively appending it
                # produced `put -O '$REMOTE_DIR/.'`, which lftp would not accept
                # — so the one file that has ever gone missing here, og-image.jpg,
                # was also the one the repair could not fix.
                echo "put -O '$REMOTE_DIR' '_deploy/$f';"
              else
                echo "mkdir -p '$REMOTE_DIR/$d';"
                echo "put -O '$REMOTE_DIR/$d' '_deploy/$f';"
              fi
            done < /tmp/missing.txt
          } > /tmp/repair.lftp
          echo "--- repair script ---"
          grep -v "^open " /tmp/repair.lftp | sed 's/^/  /'
          echo "---------------------"
          lftp -f /tmp/repair.lftp || echo "(repair reported errors; the re-check below decides)"

          remote_list > /tmp/remote2.txt
          still=$(comm -23 /tmp/expected.txt /tmp/remote2.txt || true)
          if [ -n "$still" ]; then
            echo "STILL MISSING after repair — failing the deploy:"
            echo "$still" | sed 's/^/  /'
            exit 1
          fi
          echo "repair succeeded; all files present"

      # Retry rather than check once. The first run failed here despite having
      # deployed correctly: it looked 5 seconds after the upload, got the old
      # HTML, and went red on a site that was in fact fine. A single check makes
      # this step a coin toss, and a deploy job that cries wolf gets ignored,
      # which is worse than not having the check at all.
      - name: Confirm the live site is serving this commit
        run: |
          V="${GITHUB_SHA::7}"
          for i in $(seq 1 12); do
            got=$(curl -sS --max-time 30 "https://coffeeshtob.ru/?ci=$GITHUB_RUN_ID-$i" 2>/dev/null \
                  | grep -o "style.css?v=[A-Za-z0-9_.-]*" | head -1 || true)
            if [ "$got" = "style.css?v=$V" ]; then
              echo "live site is serving $V (after $i attempt(s))"
              exit 0
            fi
            sleep 10
          done
          echo "After ~2 minutes the live site still reports: ${got:-<nothing>}"
          echo "Expected style.css?v=$V. The upload and manifest checks passed,"
          echo "so this is either caching or the domain pointing somewhere else."
          exit 1
