name: Deploy theme to Grav staging

# Staging is the Grav install at test.tryphopx.beget.tech, where the theme is
# being built before it replaces the static production site.
#
# This deploys ONLY what is ours — the theme and the seed content under grav/ —
# never Grav's core. system/ and vendor/ are Grav's, are 60+ MB, and are updated
# through Grav's own admin panel. Committing them would make every version bump
# a thousand-file diff and would mean hand-rolling updates Grav does in two
# clicks. That split is the whole reason the repo mirrors Grav's layout under a
# grav/ prefix rather than at the root.
#
# SETUP — one extra repository secret beside the four the production job uses:
#   STAGING_DIR   /test.tryphopx.beget.tech/public_html

on:
  push:
    branches: [main]
    paths:
      - 'grav/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets exist
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
        run: |
          missing=
          for v in FTP_HOST FTP_USER FTP_PASSWORD STAGING_DIR; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            exit 1
          fi

      # Cheap, offline, and it runs before anything is uploaded. The three
      # files it compares drift silently — Twig renders a missing key as an
      # empty string, so a rename shows up as a blank section on the live site
      # rather than as an error. That is the exact failure the old Decap setup
      # had between index.html, home.json and config.yml.
      - name: Check the content fields agree
        run: python3 .github/scripts/check-content-fields.py

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ABOUT THE DATA CHANNEL, AND WHAT IS ACTUALLY ESTABLISHED.
      #
      # Beget loses some files during a mirror — deterministically the same
      # ones, independent of size, type and directory. og-image.jpg has failed
      # this way since the first deploy. lftp reported only "max-retries
      # exceeded", which produced four wrong theories; asked with debug 3, the
      # server said what it was doing:
      #
      #   <--- 426 Failure reading network stream.
      #
      # The repair ladder was built to find which transport survives, and the
      # first result looked conclusive — with the mirror on an encrypted data
      # channel, the encrypted rung failed and the plaintext rung succeeded, so
      # the mirrors were switched to plaintext.
      #
      # THE NEXT RUN UNDERCUT THAT. With the mirror on plaintext, the mirror
      # still lost og-image.jpg, and the repair's FIRST rung — the identical
      # setting — put it there without complaint. So encryption is not the
      # discriminator. What differs is that the repair issues one `put` on a
      # fresh connection, while the mirror is a long-lived session that has
      # already moved dozens of files by the time it reaches this one.
      #
      # That is an observation, not a theory to act on: two runs is not enough
      # to name a cause, and this project has already spent days on confident
      # explanations of this exact symptom. What IS established is that the
      # repair pass lands the file every time and the URL checks prove the
      # outcome. Plaintext is kept because it costs nothing — the control
      # connection stays TLS, so the password is never in the clear, and the
      # file bytes are about to be public anyway — not because it was shown to
      # be the fix.
      - name: Deploy the theme
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
        run: |
          set -uo pipefail
          test -f grav/user/themes/coffeeshtob/blueprints.yaml \
            || { echo "theme not found — refusing to deploy"; exit 1; }
          # --delete is scoped to the theme directory alone. Grav's core, the
          # client's pages and their uploaded media all live outside it and are
          # never touched by this job.
          #
          # lftp's exit code is ignored for the same reason as in deploy.yml: on
          # Beget it returns 1 for non-failures. The render check at the end of
          # this job is what decides — it fetches staging and looks for the
          # site's own markup, which is a fact about the result rather than an
          # opinion about the transfer.
          lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ftp:ssl-protect-data false; set ssl:verify-certificate no;
            set net:max-retries 8; set net:timeout 40; set net:reconnect-interval-base 5;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --delete --no-perms --verbose --parallel=1 \
              grav/user/themes/coffeeshtob/ '$STAGING_DIR/user/themes/coffeeshtob';
          " || echo "mirror exited non-zero — the render check below decides"

      # The root files, so /privacy, /sitemap.xml and the rest can be verified
      # here before they are trusted on production.
      #
      # .htaccess is EXCLUDED, and that exclusion is load-bearing: the
      # production file forces HTTPS and redirects www to the bare domain.
      # Staging is plain http on a beget.tech subdomain, so deploying it here
      # would redirect every request to an https:// URL this host has no
      # certificate for — staging would break in a way that looks like the
      # theme's fault. The file is tested against a local Apache instead, with a
      # Grav-shaped docroot and the X-Forwarded-Proto header simulated.
      #
      # No --delete: the neighbours here are Grav's own core files.
      - name: Deploy the web-root files (never .htaccess)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
        run: |
          set -uo pipefail
          lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:max-retries 8; set net:timeout 40;
            set cmd:fail-exit false;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --no-perms --verbose --parallel=1 \
              --exclude-glob .htaccess \
              grav/root/ '$STAGING_DIR';
          " || echo "(root mirror reported errors; the repair below decides)"

          # og-image.jpg is the file whose data connection this host drops, and
          # it 404'd here on the first run that deployed these files — the mirror
          # swallowed the failure and the URL check caught it one step later.
          # A mirror finishing is not evidence the files arrived.
          #
          # .htaccess is not in the local set (excluded above), so it is neither
          # checked for nor uploaded here.
          rm -rf _root && mkdir _root
          cp -R grav/root/. _root/ && rm -f _root/.htaccess
          .github/scripts/ftp-repair.sh _root "$STAGING_DIR"

      # Deliberately NOT part of the normal push path. Pages are what the client
      # edits in the admin panel; overwriting them on every deploy would throw
      # their work away. This seeds the initial content once, by hand.
      - name: Seed page content (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
        run: |
          echo "Seeding grav/user/pages/ — this OVERWRITES pages on staging."
          # Grav's stock install ships user/pages/01.home/default.md. Because
          # this mirror deliberately has no --delete (client pages must survive
          # deploys), seeding leaves that file in place beside our home.md — and
          # Grav then renders it, asking for a default.html.twig this theme has
          # no reason to provide. First activation failed exactly that way.
          #
          # Removing it by name is precise: it targets Grav's demo page and
          # nothing the client could have created.
          lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set cmd:fail-exit false;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --no-perms --verbose --parallel=1 \
              grav/user/pages/ '$STAGING_DIR/user/pages';
            rm -f '$STAGING_DIR/user/pages/01.home/default.md';
            rm -rf '$STAGING_DIR/user/pages/02.typography';
          " || echo "(seed reported errors; the render check below decides)"

          # Images are PAGE MEDIA in Grav: a page stores a bare filename and
          # Grav resolves it against that page's OWN folder. So a photo used on
          # /kuhnya has to physically sit in user/pages/04.kuhnya/, and a photo
          # used on two pages has to sit in both. Until it does, the image falls
          # back to the placeholder and the client's media picker is empty.
          #
          # This used to mirror all of images/uploads/ into 01.home, which was
          # right while there was one page and is wrong now: it would give the
          # landing page a media picker listing every photo on the site and leave
          # the other seven with none.
          #
          # page-media.py works out the mapping by reading the page files, so it
          # cannot drift from the content the way a hand-kept manifest would —
          # and it exits non-zero if a page names a photo that is not in
          # images/uploads/, which is either a typo or a file the client uploaded
          # straight into Grav and that would not survive a reseed.
          #
          # The photos are not committed a second time under grav/: 5.2 MB of the
          # same JPEGs already in this repo is not worth duplicating.
          echo "Seeding page media, one folder at a time"
          python3 .github/scripts/page-media.py > /tmp/media.tsv
          echo "  $(wc -l < /tmp/media.tsv) photo(s) to place"

          # Client uploads land in these same folders and no --delete is used
          # anywhere here, so they survive every later deploy.
          while IFS=$'\t' read -r page file; do
            [ -n "$page" ] || continue
            echo "  $file -> $page"
            lftp -c "
              set ftp:ssl-allow true; set ftp:ssl-force true;
              set ftp:ssl-protect-data false; set ssl:verify-certificate no;
              set net:max-retries 8; set net:timeout 40;
              set cmd:fail-exit false;
              open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
              mkdir -p '$STAGING_DIR/user/pages/$page';
              put -O '$STAGING_DIR/user/pages/$page' 'images/uploads/$file';
            " || echo "    (reported errors; the image check at the end decides)"
          done < /tmp/media.tsv

      # Beget serves a JavaScript interstitial to clients that do not carry a
      # `beget=begetok` cookie — a 273-byte page that sets the cookie and
      # reloads. Without it every check here reads the challenge instead of the
      # site and reports nonsense. Browsers pass it invisibly; curl does not.
      # verify-site.py sends the cookie on every request.
      #
      # This replaced three hand-written gates. They asserted a `.menu-item` on
      # the home page, listed the URLs to check by hand, and summed the images on
      # one page — all correct for a single-page site and all wrong now. The menu
      # moved to /kuhnya, and a list of routes typed into a workflow goes stale
      # the moment a page is added. The script derives the routes from the page
      # tree, exactly as the site's own navigation does, so a new section is
      # covered from the next deploy with nothing to remember.
      #
      # Every assertion is about the delivered page, never the transfer: lftp's
      # exit code is unreliable on this host and is not consulted anywhere.
      - name: Confirm staging renders every page
        run: python3 .github/scripts/verify-site.py http://test.tryphopx.beget.tech --run-id "$GITHUB_RUN_ID"
