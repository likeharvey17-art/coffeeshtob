<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Content Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    .cms-local-notice {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fdfbf8;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #241a13;
    }
    .cms-local-notice__card {
      max-width: 560px;
      background: #fff;
      border: 1px solid #e8ddcd;
      border-radius: 14px;
      padding: 28px 30px;
      box-shadow: 0 14px 34px rgba(43, 33, 25, 0.12);
    }
    .cms-local-notice h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .cms-local-notice p { margin: 0 0 14px; }
    .cms-local-notice code {
      background: #f6f0e7;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.92em;
    }
    .cms-local-notice pre {
      background: #241a13;
      color: #fdfbf8;
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0 0 14px;
    }
    .cms-local-notice small { color: #7a6a58; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    /* The GitLab PKCE backend redirects to gitlab.com and back, and the URL it
       returns to must exactly match a Redirect URI registered on the GitLab
       OAuth application. A localhost address is rarely registered, so signing
       in here usually fails with a redirect_uri mismatch.

       Local editing is meant to go through decap-server instead, which skips
       auth entirely. Detect the case where neither path is available and
       explain it, rather than leaving a login button that silently fails. */
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
      if (!isLocal) return;

      fetch('http://localhost:8081/api/v1', { method: 'HEAD' })
        .then(function () { return true; })
        .catch(function () { return false; })
        .then(function (proxyRunning) {
          if (proxyRunning) return; // decap-server is up — leave the CMS alone

          var el = document.createElement('div');
          el.className = 'cms-local-notice';
          el.innerHTML =
            '<div class="cms-local-notice__card">' +
              '<h1>Локальный режим: нужен decap-server</h1>' +
              '<p>Вы открыли админку на <code>' + host + '</code>. Вход через GitLab ' +
              'отсюда обычно не проходит: GitLab возвращает браузер только на те ' +
              'адреса, которые заранее указаны в настройках приложения.</p>' +
              '<p>Для локального редактирования запустите в папке проекта:</p>' +
              '<pre>npx decap-server</pre>' +
              '<p>и обновите страницу — вход не потребуется.</p>' +
              '<p><small>На опубликованном сайте вход работает через GitLab: ' +
              'в <code>admin/config.yml</code> должны быть заполнены ' +
              '<code>repo</code> и <code>app_id</code>, а адрес админки — добавлен ' +
              'в Redirect URI приложения GitLab.</small></p>' +
            '</div>';
          document.body.appendChild(el);
        });
    })();
  </script>
</body>
</html>
