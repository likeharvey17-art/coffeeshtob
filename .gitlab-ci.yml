# Deploys the site to Beget over FTPS on every push to main.
#
# Why this exists: Decap CMS commits content edits to this repo, but Beget is
# plain file hosting — it has no idea the repo changed. Without this job an
# edit made in /admin/ would land in GitLab and never reach visitors, silently.
# This closes that gap: edit in the CMS -> Decap commits -> this job runs ->
# the live site updates.
#
# SETUP — add these under Settings -> CI/CD -> Variables in GitLab.
# Tick "Mask variable" on the password. Do not put any of them in this file.
#
#   FTP_HOST      your Beget FTP host (e.g. yourlogin.beget.tech)
#   FTP_USER      FTP login
#   FTP_PASSWORD  FTP password        <- mask this one
#   REMOTE_DIR    web root for the domain, e.g. /yourdomain.ru/public_html
#
# NOTE ON --delete: the server is made to mirror the repo exactly, so files in
# REMOTE_DIR that are not in the repo get removed. That is what keeps stale
# files from piling up, but it means REMOTE_DIR must contain only this site.
# If you keep anything else there, drop --delete from the mirror command.

stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.20
  # Only main. Feature branches and merge requests must not touch production.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache lftp
    - |
      for v in FTP_HOST FTP_USER FTP_PASSWORD REMOTE_DIR; do
        eval "val=\$$v"
        if [ -z "$val" ]; then
          echo "CI variable $v is not set — add it under Settings > CI/CD > Variables."
          exit 1
        fi
      done
  script:
    - |
      lftp -c "
        set ftp:ssl-allow true;
        set ftp:ssl-force true;
        set ftp:ssl-protect-data true;
        set ssl:verify-certificate no;
        set net:max-retries 3;
        set net:timeout 20;
        open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
        mirror --reverse --delete --verbose --parallel=4 \
          --exclude-glob .git/ \
          --exclude-glob .claude/ \
          --exclude .gitlab-ci.yml \
          --exclude .gitignore \
          --exclude CLAUDE.md \
          ./ '$REMOTE_DIR';
      "
  environment:
    name: production
