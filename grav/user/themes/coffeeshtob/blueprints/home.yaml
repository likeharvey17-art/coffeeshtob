title: Главная страница

# The editing form the client actually uses for the landing page.
#
# Everything is in Russian on purpose — the person maintaining this site is not
# a developer and should never have to guess what `hero_lead` means.
#
# WHY A BLUEPRINT AT ALL: without one, Grav shows the page's front matter as a
# raw YAML box. That works, and it is also exactly how a client deletes a colon
# and takes the site down. A blueprint turns the same data into labelled text
# boxes with no syntax to get wrong.
#
# FIELD NAMES ARE THE STABLE IDENTIFIER, labels are not. Names match
# templates/home.html.twig one for one. A rename here that is not made there
# silently blanks that part of the page, because Twig prints nothing for a
# missing key. .github/scripts/check-content-fields.py compares them on every
# deploy so that cannot pass unnoticed.
#
# THIS FORM IS MUCH SHORTER THAN IT USED TO BE. The menu, the schedule and the
# «Жизнь штаба» blocks are their own pages now, each with its own form. There is
# deliberately no field here listing the sections shown on the landing page:
# that grid is built from the page tree, so it can never advertise a section
# that has been renamed or removed.

extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        hero:
          type: tab
          title: Первый экран
          fields:
            header.hero_title:
              type: text
              label: Заголовок
              help: 'Крупная надпись поверх фотографии.'
            header.hero_lead:
              type: textarea
              label: Короткий текст под заголовком
              rows: 3
            header.hero_badge:
              type: text
              label: Адрес в плашке сверху
              help: 'Короткая строка рядом со значком метки.'
            header.hero_image:
              type: pagemediaselect
              label: Фон первого экрана
              help: 'Сначала загрузите фотографию во вкладке «Медиа» этой страницы, затем выберите её здесь. Фото размывается и затемняется, поэтому подойдёт почти любое — важно, чтобы белый заголовок оставался читаемым.'
            header.cta1_text:
              type: text
              label: Первая кнопка — надпись
              help: 'Кнопка показывается только если заполнены оба поля — и надпись, и страница.'
            header.cta1_url:
              type: pages
              label: Первая кнопка — куда ведёт
            header.cta2_text:
              type: text
              label: Вторая кнопка — надпись
            header.cta2_url:
              type: pages
              label: Вторая кнопка — куда ведёт

        about:
          type: tab
          title: О штабе
          fields:
            header.about_title:
              type: text
              label: Заголовок раздела
            header.about_image:
              type: pagemediaselect
              label: Фотография раздела
            header.about_text:
              type: textarea
              label: Текст о штабе
              rows: 8
              help: 'Пустая строка между абзацами начинает новый абзац. Это короткое представление на главной — подробная история живёт в разделе «Сказки штаба».'

        sections:
          type: tab
          title: Список разделов
          fields:
            header.sections_title:
              type: text
              label: Заголовок над списком разделов
            header.sections_sub:
              type: text
              label: Подзаголовок
              help: 'Сами разделы в этот список добавлять не нужно: они берутся из дерева страниц. Чтобы изменить порядок — переставьте страницы в разделе Pages; чтобы поменять фотографию или описание раздела — откройте саму страницу, вкладка «Карточка на главной».'

        seo:
          type: tab
          title: SEO
          fields:
            header.seo_title:
              type: text
              label: Заголовок вкладки браузера
              help: 'Он же в результатах поиска и в превью ссылки. До ~60 знаков.'
            header.seo_description:
              type: textarea
              label: Описание для поиска
              rows: 3
              help: 'Показывается под ссылкой в поиске. До ~160 знаков.'
