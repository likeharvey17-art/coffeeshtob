name: Deploy to Beget

# Beget is plain file hosting — it has no idea the repo changed — so without this
# an edit lands in git and never reaches visitors.
#
# WHAT THIS DEPLOYS, AND WHAT IT MUST NEVER TOUCH.
#
# The site is WordPress. WordPress itself, its plugins and — above all —
# wp-content/uploads/ and wp-config.php belong to the SERVER, not to this repo.
# The client edits pages in wp-admin and uploads photographs; none of that is in
# git and none of it can be recreated from git. So this job writes exactly two
# places:
#
#   wp-content/themes/coffeeshtob/   ours, mirrored with --delete
#   the document root                four files, mirrored WITHOUT --delete
#
# The second one matters more than it looks: its neighbours are wp-config.php,
# wp-content/ and WordPress's own core files. A --delete there would remove the
# entire installation and every photograph the client has ever uploaded.
#
# SETUP — Settings → Secrets and variables → Actions:
#   Secrets    FTP_HOST, FTP_USER, FTP_PASSWORD, REMOTE_DIR
#   Variable   SITE_URL   e.g. https://coffeeshtob.ru
#
# SITE_URL is a variable rather than a hardcoded string because this project has
# now changed hosting three times, and each move meant editing a URL buried in a
# workflow. Moving to another Beget account is four secrets and one variable.

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - 'web-root/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      upload_seed:
        description: 'Also upload the one-time starting content (a fresh install only)'
        type: boolean
        default: false

# Never let two deploys interleave over the same FTP tree. Queue rather than
# cancel: a half-finished mirror that gets cancelled leaves the site in a mixed
# state, which is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets and the site URL exist
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=
          for v in FTP_HOST FTP_USER FTP_PASSWORD REMOTE_DIR SITE_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing:$missing"
            echo "Secrets and the SITE_URL variable live under"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Cheap, offline, and it runs before anything is uploaded. WordPress
      # returns an empty string for a meta key that does not exist, so a renamed
      # field is a blank section with a 200 response — no error anywhere. This is
      # the third platform this project has used and the third on which that same
      # bug was possible; it is checked rather than remembered.
      - name: Check the theme's field names agree
        run: python3 .github/scripts/check-fields.py

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # THE INTERLOCK. Everything below writes into a directory it assumes is a
      # WordPress root. Pointed at the wrong path — a stale REMOTE_DIR after an
      # account move, most likely — it would scatter a theme directory into
      # somebody else's docroot and then report success, because the URL checks
      # at the end run against SITE_URL and not against what was actually
      # written.
      #
      # wp-load.php exists in every WordPress install and nowhere else. This asks
      # the server rather than trusting the secret.
      - name: Refuse to deploy into something that is not WordPress
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -uo pipefail
          found=$(lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ssl:verify-certificate no; set cmd:fail-exit false;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            cls -1 '$REMOTE_DIR/wp-load.php';
          " </dev/null 2>/dev/null | grep -c . || true)
          if [ "$found" -eq 0 ]; then
            echo "REFUSING TO DEPLOY."
            echo
            echo "$REMOTE_DIR does not contain wp-load.php, so it is not a"
            echo "WordPress installation. Either WordPress has not been installed"
            echo "there yet, or REMOTE_DIR points somewhere else — check it after"
            echo "any hosting move."
            exit 1
          fi
          echo "target is a WordPress install — continuing"

      # Assembled rather than mirrored straight from the checkout, so the upload
      # set is exactly what we mean to send.
      #
      # seed/ is 3.7 MB of starting content and photographs that are used ONCE,
      # on a fresh install, by Инструменты → Наполнить сайт. Sending it on every
      # push would be 3.7 MB over an FTP connection this host already drops
      # files on, for a folder the site never reads again.
      - name: Assemble the theme
        env:
          UPLOAD_SEED: ${{ inputs.upload_seed }}
        run: |
          set -euo pipefail
          rm -rf _theme && mkdir -p _theme
          cp -R wp-content/themes/coffeeshtob/. _theme/
          if [ "${UPLOAD_SEED:-false}" != "true" ]; then
            rm -rf _theme/seed
            echo "seed excluded (pass upload_seed on a manual run for a fresh install)"
          else
            test -f _theme/seed/content.php || { echo "seed requested but missing"; exit 1; }
            echo "seed included: $(du -sh _theme/seed | cut -f1)"
          fi

          # Assert rather than hope. A half-built set would be mirrored with
          # --delete and would take the live theme with it.
          for f in style.css functions.php header.php footer.php front-page.php index.php; do
            test -f "_theme/$f" || { echo "missing $f"; exit 1; }
          done
          n=$(find _theme -type f | wc -l)
          [ "$n" -ge 25 ] || { echo "only $n files assembled — refusing"; exit 1; }
          echo "assembled $n files"

      # ABOUT lftp's EXIT CODE, WHICH IS NOT CONSULTED ANYWHERE IN THIS REPO.
      #
      # On this host it returns 1 for things that are not failures — SITE CHMOD
      # refusals were the first, and --no-perms did not make it exit 0, so there
      # is at least one more. It has also exited 0 having silently skipped a
      # file. Three separate investigations were spent on a font that was never
      # broken.
      #
      # So the mirror reports and the checks that follow decide: a repair pass
      # that lists what is actually on the server, and then verify-site.py, which
      # fetches the delivered pages. Both measure the outcome instead of trusting
      # the tool's opinion of it.
      - name: Mirror the theme
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          UPLOAD_SEED: ${{ inputs.upload_seed }}
        run: |
          set -uo pipefail
          # --delete is scoped to the THEME directory alone. WordPress core, the
          # plugins, wp-config.php and every uploaded photograph live outside it
          # and are never touched. Widening this path is how a deploy eats a
          # client's work.
          #
          # seed/ is excluded from --delete only while it is not in the upload
          # set, so a seed uploaded for a fresh install survives until the client
          # has actually used it; the seeder removes it afterwards.
          EXCLUDE=""
          if [ "${UPLOAD_SEED:-false}" != "true" ]; then
            EXCLUDE="--exclude-glob seed/"
          fi
          lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ftp:ssl-protect-data false; set ssl:verify-certificate no;
            set net:max-retries 8; set net:timeout 40; set net:reconnect-interval-base 5;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --delete --no-perms --verbose --parallel=1 $EXCLUDE \
              _theme/ '$REMOTE_DIR/wp-content/themes/coffeeshtob';
          " || echo "mirror exited non-zero — the repair and the URL checks decide"

          .github/scripts/ftp-repair.sh _theme "$REMOTE_DIR/wp-content/themes/coffeeshtob"

      # Files that must sit at the web root because something outside this site
      # asks for them by absolute path: crawlers fetch /robots.txt and
      # /favicon.ico by convention, Yandex fetches its verification token at a
      # fixed URL, and .htaccess is Apache's.
      #
      # NO --delete HERE, EVER. See the note at the top of this file.
      - name: Deploy the files that must live at the web root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -uo pipefail
          test -f web-root/.htaccess || { echo "web-root/.htaccess missing"; exit 1; }
          lftp -c "
            set ftp:ssl-allow true; set ftp:ssl-force true;
            set ftp:ssl-protect-data false; set ssl:verify-certificate no;
            set net:max-retries 8; set net:timeout 40; set cmd:fail-exit false;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --no-perms --verbose --parallel=1 \
              web-root/ '$REMOTE_DIR';
          " || echo "root mirror exited non-zero — the repair below decides"

          .github/scripts/ftp-repair.sh web-root "$REMOTE_DIR"

      # The gate. Everything above is a transfer; this is the site.
      - name: Confirm the site renders every page
        run: python3 .github/scripts/verify-site.py "${{ vars.SITE_URL }}" --run-id "$GITHUB_RUN_ID"

      - name: What to do next on a fresh install
        if: ${{ inputs.upload_seed }}
        run: |
          {
            echo "### Starting content uploaded"
            echo
            echo "Open **Инструменты → Наполнить сайт** in wp-admin and press the"
            echo "button. It creates the eight pages, the cards and the photographs,"
            echo "then removes itself. It refuses to run on a site that already has"
            echo "pages, so it cannot overwrite the client's work."
          } >> "$GITHUB_STEP_SUMMARY"
